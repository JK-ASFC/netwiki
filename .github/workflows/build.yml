# NetWiki — compilation multi-plateforme et publication des versions.
# Copyright (c) 2026 JK-ASFC — licence MIT (voir LICENSE).
#
# Déclenchement : poussée d'une étiquette « v1.40.0 » (publication) ou lancement manuel (artefacts seulement).
# Secrets facultatifs (Settings → Secrets and variables → Actions) :
#   NETWIKI_SIGNING_KEY          clé privée Ed25519 (PEM) qui signe le paquet de contenu (obligatoire pour les mises à jour en ligne)
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD        certificat de signature de code Windows (.pfx en base64)
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   signature et notarisation macOS
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  signature Android
#                                (obligatoire pour publier l'APK : mêmes valeurs à chaque version, voir docs/ANDROID.md)

name: Compilation et publication

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bureau:
    name: Bureau (${{ matrix.nom }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
            cible: --win
          - os: macos-latest
            nom: macOS
            cible: --mac
          - os: ubuntu-latest
            nom: Linux
            cible: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs --prod
      - name: Construire les installeurs
        shell: bash
        # Une variable vide (secret absent) est prise pour un certificat sur macOS : on la retire.
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -n "${!v}" ] || unset "$v"; done
          npx electron-builder ${{ matrix.cible }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '') && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: netwiki-${{ matrix.nom }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  contenu:
    name: Paquet de contenu signé
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signer le contenu (Ed25519, JK-ASFC)
        if: ${{ env.NETWIKI_SIGNING_KEY != '' }}
        run: node scripts/pack-content.js
        env:
          NETWIKI_SIGNING_KEY: ${{ secrets.NETWIKI_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: netwiki-contenu
          path: release/*.netwiki
          if-no-files-found: warn
    env:
      NETWIKI_SIGNING_KEY: ${{ secrets.NETWIKI_SIGNING_KEY }}

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/build-web.mjs --prod
      - name: Projet Capacitor Android
        working-directory: mobile
        run: |
          npm install
          npx cap sync android
      # Clé de signature officielle : la même à chaque version, sinon Android refuse la mise à jour par-dessus
      # l'installation existante. Sans clé, une version publiée (étiquette v*) n'inclut pas d'application Android.
      - name: Clé de signature Android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/netwiki.jks"
            { echo "NETWIKI_KEYSTORE=$RUNNER_TEMP/netwiki.jks"; echo "NETWIKI_KEY_ALIAS=$ANDROID_KEY_ALIAS"; } >> "$GITHUB_ENV"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"; echo "::add-mask::$ANDROID_KEY_PASSWORD"
            { echo "NETWIKI_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"; echo "NETWIKI_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error title=Android::Secret ANDROID_KEYSTORE_BASE64 absent : l'application Android n'est pas publiée (voir docs/ANDROID.md)."
            exit 1
          else
            echo "::warning title=Android::Clé officielle absente : APK de test signé avec une clé temporaire (ne pas distribuer)."
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/netwiki.jks" -storepass "$P" -keypass "$P" -alias test \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=NetWiki test" >/dev/null
            { echo "NETWIKI_KEYSTORE=$RUNNER_TEMP/netwiki.jks"; echo "NETWIKI_KEY_ALIAS=test"; echo "NETWIKI_KEYSTORE_PASSWORD=$P"; echo "NETWIKI_KEY_PASSWORD=$P"; } >> "$GITHUB_ENV"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Compiler (APK GitHub à mise à jour intégrée + bundle AAB pour le Play Store)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleGithubRelease bundlePlayRelease
          V=$(node -p "require('../../package.json').version")
          mkdir -p ../../release
          cp app/build/outputs/apk/github/release/app-github-release.apk "../../release/NetWiki-$V.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "../../release/NetWiki-$V.aab"
          rm -f "$RUNNER_TEMP/netwiki.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "../../release/NetWiki-$V.apk" | sed -n '1,3p'
      - uses: actions/upload-artifact@v4
        with:
          name: netwiki-android
          path: |
            release/*.apk
            release/*.aab

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.mjs --prod
      - name: Projet Capacitor iOS
        working-directory: mobile
        run: |
          npm install
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Compiler pour le simulateur (sans signature)
        working-directory: mobile/ios/App
        run: |
          if [ -d App.xcworkspace ]; then CIBLE="-workspace App.xcworkspace"; else CIBLE="-project App.xcodeproj"; fi
          xcodebuild $CIBLE -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qr ../../../../NetWiki-simulateur.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: netwiki-ios
          path: mobile/ios/App/NetWiki-simulateur.zip

  publication:
    name: Publication GitHub
    # Publie ce qui a été compilé, même si une plateforme a échoué ; le paquet de contenu signé est obligatoire.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.contenu.result == 'success' }}
    needs: [bureau, contenu, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      # Liste signée des empreintes : NetWiki la vérifie avant de remplacer l'exécutable portable ou de lancer l'installeur.
      - name: Signer la liste des fichiers (Ed25519, JK-ASFC)
        run: node scripts/sign-release.js artefacts "${{ github.ref_name }}"
        env:
          NETWIKI_SIGNING_KEY: ${{ secrets.NETWIKI_SIGNING_KEY }}
      - uses: softprops/action-gh-release@v2
        with:
          name: NetWiki ${{ github.ref_name }}
          body: |
            **Soutenir NetWiki** : le projet est gratuit, libre et maintenu bénévolement par JK-ASFC. Un don, même modeste, aide à le faire vivre → https://liberapay.com/JK-ASFC/donate

            [![Faire un don avec Liberapay](https://liberapay.com/assets/widgets/donate.svg)](https://liberapay.com/JK-ASFC/donate)
          generate_release_notes: true
          files: artefacts/**
